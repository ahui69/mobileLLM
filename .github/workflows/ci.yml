name: CI

# Hosted Linux runs portable contract/API/verification behavior tests as well as document checks.
# Apple-framework/Metal gates remain available on an explicitly enabled self-hosted Mac.

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification-documents:
    name: verification documents (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate verification JSON and test plans
        run: |
          find Verification/AgentHarness -type f \( -name '*.json' -o -name '*.xctestplan' \) -print0 \
            | xargs -0 -n1 jq empty

      - name: Check verification script syntax
        run: |
          for script in scripts/verification/*.sh scripts/*.sh; do
            bash -n "$script"
          done

      - name: Require the requirement manifest and registries to bind the checked-in spec.md
        run: |
          expected="$(sha256sum spec.md | awk '{print $1}')"
          echo "spec.md sha256: $expected"
          status=0
          for manifest in Verification/AgentHarness/requirements.v1.json \
                          Verification/AgentHarness/Registries/*.json; do
            recorded="$(jq -r '.sourceSpecification.sha256 // empty' "$manifest")"
            path="$(jq -r '.sourceSpecification.path // empty' "$manifest")"
            if [[ -z "$recorded" ]]; then
              echo "::error file=$manifest::missing sourceSpecification.sha256"
              status=1
            elif [[ "$path" != "spec.md" ]]; then
              echo "::error file=$manifest::sourceSpecification.path is '$path', expected 'spec.md'"
              status=1
            elif [[ "$recorded" != "$expected" ]]; then
              echo "::error file=$manifest::sourceSpecification.sha256 $recorded does not match spec.md $expected"
              status=1
            else
              echo "ok  $manifest"
            fi
          done
          exit "$status"

      - name: Refuse committed secrets and generated artifacts
        run: |
          status=0
          for forbidden in Signing.xcconfig mobileLLM.xcodeproj Packages/LLMEngineLlama/Vendor/llama.xcframework; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error::$forbidden must never be committed"
              status=1
            fi
          done
          if git ls-files | grep -E '\.(gguf|safetensors)$'; then
            echo "::error::model weights must never be committed"
            status=1
          fi
          exit "$status"

  portable-swift:
    name: portable Swift behavior tests
    runs-on: ubuntu-latest
    container: swift:6.2.4-jammy
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run contract, sandbox API, and verifier tests
        run: |
          for package in Packages/AgentContracts Packages/AgentSandboxAPI Tools/AgentHarnessVerification; do
            swift test --package-path "$package" --scratch-path "/tmp/$(basename "$package")"
          done
      - name: Verify repository semantics and architecture
        run: swift run --package-path Tools/AgentHarnessVerification --scratch-path /tmp/AgentHarnessVerification agent-harness-verify static --repo-root "$GITHUB_WORKSPACE"

  macos-behavior:
    name: Apple package behavior tests (self-hosted)
    if: vars.MOBILELLM_SELF_HOSTED_MAC == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run every non-Metal package suite
        run: bash scripts/verification/run-behavior-tests.sh
